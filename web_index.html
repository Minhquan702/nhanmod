function library(){if(detail!==null)return skinScreen(detail);return `${intro()}<div class="section"><h2>Tướng / Skin</h2></div><div class="search garena-search"><input id="searchInput" value="${safe(query)}" placeholder="Tìm kiếm tướng" aria-label="Tìm tướng hoặc skin" oninput="searchChange(this.value)"><button type="button" onclick="document.getElementById('searchInput').focus();catalog()" aria-label="Tìm kiếm"><img src="/assets/roles/search.png" alt=""></button></div><div class="role-filters" aria-label="Lọc vai trò">${roleFilters.map(([id,label])=>`<button class="${role===id?'on':''}" aria-pressed="${role===id}" onclick="filterRole(${id})"><img src="/assets/roles/${id}.png" alt=""><span>${label}</span></button>`).join('')}</div><div class="filter-summary"><span id="resultCount"></span>${role?'<button onclick="filterRole(0)">Xem tất cả ×</button>':''}</div><div id="catalog"></div>`}
function filtered(){return heroes.map((h,i)=>({...h,i})).filter(h=>(!role||(h.roles||[]).includes(role))&&(!query||norm(h.name).includes(norm(query))||h.skins.some(s=>norm(s.name).includes(norm(query)))))}
function catalog(){const rows=filtered(),pages=role?1:Math.max(1,Math.ceil(rows.length/24));page=Math.min(page,pages-1);const visible=role?rows:rows.slice(page*24,(page+1)*24);const count=document.getElementById('resultCount');if(count)count.textContent=(role?roleFilters.find(x=>x[0]===role)[1]+' · ':'')+visible.length+' / '+rows.length+' tướng'+(query?' · Kết quả tìm kiếm':'');document.getElementById('catalog').innerHTML=rows.length?`<div class="grid">${visible.map(h=>{const chosen=selected.some(s=>s.tuong===h.name);return `<button class="hero ${chosen?'has-selection':''}" onclick="openHero(${h.i})"><div class="portrait">${image(selected.find(s=>s.tuong===h.name)?.icon||h.icon,h.icon_fallback)}${chosen?'<span class="chosen" aria-label="Đã chọn">✓</span>':''}</div><div class="hero-copy"><b>${safe(h.name)}</b><span class="selection-status">${chosen?'Đã chọn':'&nbsp;'}</span></div><svg class="icon hero-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>`}).join('')}</div>${pages>1?`<div class="pager"><button ${page===0?'disabled':''} onclick="changePage(-1)" aria-label="Trang trước">←</button><span>${String(page+1).padStart(2,'0')} / ${String(pages).padStart(2,'0')}</span><button ${page+1===pages?'disabled':''} onclick="changePage(1)" aria-label="Trang sau">→</button></div>`:''}`:'<div class="empty">Không tìm thấy tướng hoặc skin.</div>'}
function searchChange(v){query=v;page=0;catalog()}function filterRole(v){role=role===v?0:v;page=0;feedback();render()}function changePage(v){page+=v;catalog();document.getElementById('catalog').scrollIntoView({block:'start',behavior:'smooth'})}function openHero(i){detail=i;render();window.scrollTo(0,0);feedback()}
function skinScreen(i){const h=heroes[i];return `<div class="skin-breadcrumb"><button onclick="detail=null;render()">${ic('back')} Tướng/Skin</button><span>›</span><b>${safe(h.name)}</b></div>${splashPreview(h)}<div class="section skin-heading"><h2>Trang phục</h2></div><div class="skins">${h.default_skin?`<button class="skin default-preview" title="Mặc định · Chỉ xem ảnh" aria-label="${safe(h.name)} · Mặc định · Chỉ xem ảnh" onclick="previewDefault(${i})">${image(h.default_skin.icon,h.icon_fallback)}</button>`:''}${h.skins.map((s,j)=>{const on=selected.some(x=>x.id===s.id);return `<button class="skin ${on?'on':''}" data-skin-id="${safe(s.id)}" title="${safe(s.name)}" aria-label="${safe(h.name+' · '+s.name)}" aria-pressed="${on}" onclick="toggleSkin(${i},${j})">${image(s.icon,s.icon_fallback)}${on?'<span class="selected-tag">✓</span>':''}<div class="skin-meta"><b>${safe(s.name)}</b><small>${safe((s.extras||[]).join(' · ')||'Trang phục')}</small><span class="skin-code">SKIN ID / ${safe(s.id)}</span></div></button>`}).join('')}</div><div class="selection-strip"><span><b id="selectionCount">${selected.length}</b> / 15 skin đã chọn</span><button onclick="showTab('bag')">Xem danh sách đã chọn ${ic('bag')}</button></div>`}
function toggleSkin(i,j){const h=heroes[i],s=h.skins[j],old=selected.findIndex(x=>x.tuong===h.name);if(old>=0){if(selected[old].id===s.id)selected.splice(old,1);else selected[old]={tuong:h.name,skin:s.name,id:s.id,icon:s.icon,icon_fallback:s.icon_fallback}}else{if(selected.length>=15){toast('Mỗi gói tối đa 15 skin.');return}selected.push({tuong:h.name,skin:s.name,id:s.id,icon:s.icon,icon_fallback:s.icon_fallback})}saveSelected();feedback();if(selected.some(x=>x.id===s.id))toast('Đã chọn '+h.name+' · '+s.name);const preview=document.getElementById('splashPreview');if(preview)preview.innerHTML=splashContents(h,selected.some(x=>x.id===s.id)?s:(h.default_skin||h.skins[0]));const chosen=new Set(selected.map(x=>x.id));document.querySelectorAll('.skin[data-skin-id]').forEach(tile=>{const on=chosen.has(tile.dataset.skinId);tile.classList.toggle('on',on);tile.setAttribute('aria-pressed',String(on));let badge=tile.querySelector('.selected-tag');if(on&&!badge){badge=document.createElement('span');badge.className='selected-tag';badge.textContent='✓';tile.appendChild(badge)}else if(!on&&badge)badge.remove();tile.classList.remove('picked');});const tile=document.querySelector('[data-skin-id="'+s.id+'"]');if(tile&&!matchMedia('(prefers-reduced-motion: reduce)').matches){tile.getAnimations().forEach(a=>a.cancel());tile.animate([{transform:'scale(1)'},{transform:'scale(.97)'},{transform:'scale(1)'}],{duration:180,easing:'ease-out'})}const count=document.getElementById('selectionCount');if(count)count.textContent=selected.length;nav()}
function device(){return `<div class="panel"><h3>Thiết bị của bạn</h3><div class="sub">Gói riêng cho từng nền tảng giúp giảm dung lượng.</div><div class="segments">${[['android','Android'],['ios','iOS'],['both','Cả 2']].map(([p,n])=>`<button class="${platform===p?'on':''}" aria-pressed="${platform===p}" onclick="setPlatform('${p}')">${ic(p)}${n}</button>`).join('')}</div></div>`}
function setPlatform(p){platform=p;store('platform',p);feedback();render()}function setBright(){bright=!bright;store('bright',bright);feedback();render()}
function bag(){return `<div class="eyebrow">GÓI SKIN CỦA BẠN</div><div class="section"><h2>Đã chọn</h2><span>${selected.length}/15 đã chọn</span></div>${selected.length?`<div class="panel">${selected.map((s,i)=>`<div class="row">${image(s.icon,s.icon_fallback)}<div class="txt"><b>${safe(s.tuong)}</b><small>${safe(s.skin)}</small></div><button class="remove" onclick="removeSkin(${i})" aria-label="Bỏ skin ${safe(s.skin)}">✕</button></div>`).join('')}<button class="secondary" onclick="clearSelected()">Xóa tất cả</button></div>`:'<div class="empty">'+ic('bag')+'<br>Đã chọn đang trống.<br><button class="secondary" onclick="showTab(\'library\')">Khám phá thư viện</button></div>'}${device()}<div class="panel"><button class="toggle" onclick="setBright()" aria-pressed="${bright}"><div><h3>✦ Hiệu ứng sáng đậm</h3><span class="sub">Tăng độ sáng hiệu ứng kỹ năng</span></div><span class="pill ${bright?'on':''}">${bright?'Đã bật':'Đã tắt'}</span></button></div><button class="primary" ${!selected.length||creating?'disabled':''} onclick="openChoice()">${ic('play')} Tạo file · ${selected.length} skin</button>`}
function removeSkin(i){selected.splice(i,1);saveSelected();render()}function clearSelected(){if(!confirm('Xóa toàn bộ skin đã chọn?'))return;selected=[];saveSelected();render()}
function setCosmetic(v){cosmetics=v;store('cosmetics',v);document.getElementById('yesfx').classList.toggle('on',v);document.getElementById('nofx').classList.toggle('on',!v);feedback()}
function openChoice(){if(!tg?.initData){toast('Mở TD MOD bằng nút trong bot Telegram.');return}if(!selected.length)return;setCosmetic(cosmetics);document.getElementById('confirmation').textContent=`${selected.length} skin · ${platform==='both'?'Android + iOS':platform==='ios'?'iOS':'Android'} · Sáng đậm ${bright?'đã bật':'đã tắt'}`;document.getElementById('choice').showModal()}
async function createJob(){if(creating)return;creating=true;document.getElementById('confirm').disabled=true;try{const d=await api('/api/jobs',{method:'POST',body:JSON.stringify({selections:selected.map(({tuong,skin,id})=>({tuong,skin,id})),platform,bright,cosmetics})});document.getElementById('choice').close();openJob(d.id)}catch(e){toast(e.message)}finally{creating=false;document.getElementById('confirm').disabled=false}}
function fmt(t){return t?new Date(t*1000).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}function expired(j){return j.state==='expired'||j.expires&&Date.now()/1000>j.expires}function label(j){return expired(j)?'HẾT HẠN':j.state==='done'?(j.task_complete?'ĐÃ MỞ KHÓA':'CHỜ NHIỆM VỤ'):j.state==='error'?'CÓ LỖI':j.state==='running'?'ĐANG TẠO':'ĐANG CHỜ'}
function jobCard(j){return `<div class="panel"><div class="jobmeta"><span class="jobstate">${label(j)}</span><small>${fmt(j.created)}</small></div><h3>${safe((j.selections||[]).map(s=>s.tuong).join(' · ')||'Gói skin')}</h3><p class="sub">${safe((j.selections||[]).map(s=>s.skin).join(' / '))}</p><div class="sub">${j.platform==='both'?'Android + iOS':j.platform==='ios'?'iOS':'Android'}${j.size?' · '+(j.size/1048576).toFixed(2)+' MB':''}${j.expires?' · Giữ đến '+fmt(j.expires):''}</div><button class="secondary" ${expired(j)||j.state==='error'?'disabled':''} onclick="openJob('${safe(j.id)}')">${j.task_complete?'Tải file':j.state==='done'?'Mở nhiệm vụ':'Xem tiến độ'}</button>${j.state==='error'?`<p class="sub">${safe(j.message)}</p>`:''}</div>`}
function history(){return `<div class="eyebrow">FILE ĐÃ TẠO</div><div class="section"><h2>Lịch sử file</h2><button class="tiny" onclick="loadHistory()">Làm mới</button></div><p class="sub">Gắn với tài khoản Telegram. File được giữ mặc định 24 giờ; có thể tiếp tục nhiệm vụ hoặc tải lại file đã mở khóa.</p><div id="historyRows">${loading?'<div class="empty">Đang tải lịch sử…</div>':jobs.length?jobs.map(jobCard).join(''):'<div class="empty">Chưa có file. Tạo gói skin đầu tiên của bạn.</div>'}</div>`}
async function loadHistory(){loading=true;render();try{jobs=(await api('/api/jobs')).jobs;loading=false;if(tab==='history'&&!activeJob)render()}catch(e){loading=false;toast(e.message);if(tab==='history')render()}}
function guide(){if(site.guide)return `<div class="panel"><h3>Cách sử dụng</h3><div class="sub" style="white-space:pre-wrap">${safe(site.guide)}</div></div>`;return `<div class="panel"><h3>Quy trình tạo file</h3>${[['01','Chọn tướng và skin trong Thư viện.'],['02','Mở Đã chọn, chọn thiết bị và sáng đậm.'],['03','Bấm Tạo file → chọn có / không nút bấm + hạ địch → xác nhận.'],['04','Đợi hoàn tất, làm nhiệm vụ rồi tải ZIP. Xem lại trong Lịch sử.']].map(([n,t])=>`<div class="guide-step"><span>${n}</span><span>${t}</span></div>`).join('')}<div class="resource-tip">Tải đủ <b>Cần thiết trong trận (100%)</b> và <b>Trải nghiệm đa dạng → Bối cảnh ngoại vi (100%)</b>.<br>Thoát hẳn game trước khi chép file. Giải nén đúng thư mục và ghi đè.</div></div>`}
function settings(){return `<div class="eyebrow">TUỲ CHỌN ỨNG DỤNG</div><div class="section"><h2>Cài đặt</h2><span>Telegram edition</span></div>${device()}<div class="panel"><h3>${ic('music')} Nhạc nền</h3><p class="sub">${music?.enabled&&music.url?safe(music.title):'Admin chưa bật nhạc.'} Chạm phát để nghe.</p><button class="toggle" onclick="toggleMusic()" aria-pressed="${musicPlaying}"><span>Phát nhạc nền</span><span class="pill ${musicPlaying?'on':''}">${musicPlaying?'Đã bật':'Đã tắt'}</span></button></div>${guide()}<button class="secondary" onclick="showNotice(true)">Xem thông báo</button>${me?.admin?'<a class="secondary" style="display:block;text-align:center" href="/admin" target="_blank" rel="noopener">Quản lý · Thống kê · Nhạc</a>':''}<button class="secondary" onclick="tg?.close()">Đóng ứng dụng</button>`}
let lastScene='';
function render(){nav();const app=document.getElementById('app'),kept=new Map();app.querySelectorAll('img').forEach(img=>{const key=img.dataset.source||img.getAttribute('src');if(key&&!kept.has(key))kept.set(key,img)});const scene=tab+':'+(detail??'');app.innerHTML='<section class="'+(scene!==lastScene?'scene-enter':'')+'">'+({library:library,bag,history,settings}[tab]||library)()+'</section>';lastScene=scene;if(tab==='library'&&detail===null)catalog();app.querySelectorAll('img').forEach(img=>{const key=img.dataset.source||img.getAttribute('src'),old=kept.get(key);if(old){img.replaceWith(old);kept.delete(key)}})}
async function openJob(id){clearTimeout(poll);activeJob=id;tab='history';nav();document.getElementById('app').innerHTML='<div class="empty"><div class="search-loader"></div>Đang lấy trạng thái file…</div>';await pollJob(id)}
function jobScreen(j){return `<section><button class="back" onclick="showTab('history')">${ic('back')} Lịch sử</button><div class="intro job-stage"><div class="eyebrow">TD MOD / TẠO FILE</div><h1>${j.state==='done'?'Gói skin sẵn sàng.':j.state==='error'?'Chưa tạo được file.':'Đang tạo diện mạo.'}</h1><p>${safe(j.message)}</p></div><div class="panel"><div class="jobmeta"><span class="jobstate">${label(j)}</span><strong>${j.percent||0}%</strong></div><progress max="100" value="${j.percent||0}"></progress><div class="job-steps"><span class="done">01 / CHUẨN BỊ</span><span class="${j.percent>=50?'done':''}">02 / XỬ LÝ</span><span class="${j.state==='done'?'done':''}">03 / XUẤT ZIP</span></div><p class="sub">${safe((j.selections||[]).map(x=>x.tuong+' · '+x.skin).join(' / '))}</p><div class="sub">${j.size?(j.size/1048576).toFixed(2)+' MB · ':''}${j.expires?'Giữ đến '+fmt(j.expires):'Có thể đóng ứng dụng; bot sẽ thông báo khi xong.'}</div></div>${j.state==='done'&&!expired(j)?`<button class="primary" onclick="${j.task_complete?'downloadFile':'beginTask'}('${safe(j.id)}')">${ic(j.task_complete?'download':'play')}${j.task_complete?'Tải ZIP về máy':'Làm nhiệm vụ để mở tải'}</button><button class="secondary" onclick="pollJob('${safe(j.id)}')">Kiểm tra lại trạng thái</button>`:''}${j.state==='error'||expired(j)?'<button class="primary" onclick="showTab(\'bag\')">Tạo lại gói skin</button>':''}${!tg?.initData?'<p class="sub">Bạn có thể quay lại bot Telegram → Mở TD MOD → Lịch sử để tải file.</p>':''}</section>`}
async function pollJob(id){clearTimeout(poll);try{const j=await api('/api/jobs/'+encodeURIComponent(id));if(activeJob!==id)return;document.getElementById('app').innerHTML=jobScreen(j);if(lastScene!=='job:'+id){document.querySelector('#app>section')?.classList.add('scene-enter');lastScene='job:'+id;}if(['queued','running'].includes(j.state)&&!document.hidden)poll=setTimeout(()=>pollJob(id),1800)}catch(e){toast(e.message);if(activeJob===id)document.getElementById('app').innerHTML='<div class="empty">'+safe(e.message)+'<button class="secondary" onclick="showTab(\'history\')">Về lịch sử</button></div>'}}
function external(url){if(tg?.initData)tg.openLink(url);else window.location.assign(url)}
let taskBusy=false;async function beginTask(id){if(taskBusy)return;taskBusy=true;try{const d=await api('/api/jobs/'+id+'/task',{method:'POST',body:'{}'});if(d.complete){pollJob(id);return}external(d.url)}catch(e){toast(e.message)}finally{taskBusy=false}}
async function downloadFile(id){try{const d=await api('/api/jobs/'+id+'/download-link',{method:'POST',body:'{}'});external(d.url)}catch(e){toast(e.message)}}
async function showNotice(force=false){try{if(!force&&read('noticeUntil',0)>Date.now())return;const n=await api('/api/notice');if(!n.enabled)return;document.getElementById('welcomeTitle').textContent=n.title;const body=document.getElementById('welcomeBody');if(n.html)body.innerHTML=n.html;else body.textContent=n.content||'';document.getElementById('welcome').showModal()}catch(e){if(force)toast(e.message)}}function hideNotice(){store('noticeUntil',Date.now()+3600000);document.getElementById('welcome').close()}
async function init(){try{try{site=await api('/api/site');document.querySelector('.brand b').textContent=site.name;document.querySelector('.brand small').textContent=site.subtitle;document.title=site.name+' · Mod skin AOV'}catch(e){}const d=await api('/api/skins');heroes=d.heroes;selected=selected.filter(x=>heroes.some(h=>h.name===x.tuong&&h.skins.some(s=>s.id===x.id&&s.name===x.skin))).slice(0,15).map(x=>{const s=heroes.find(h=>h.name===x.tuong).skins.find(s=>s.id===x.id);return {...x,icon:s.icon,icon_fallback:s.icon_fallback}});saveSelected();try{music=await api('/api/music')}catch(e){}if(tg?.initData){me=await api('/api/me');document.getElementById('who').textContent=me.name}else{document.getElementById('who').textContent='BẢN XEM';}render();const jid=new URLSearchParams(location.search).get('job');if(jid)await openJob(jid);else if(tg?.initData)showNotice()}catch(e){document.getElementById('app').innerHTML='<div class="empty">'+safe(e.message)+'<button class="secondary" onclick="location.reload()">Thử lại</button></div>'}}
document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('app-paused',document.hidden);if(document.hidden){clearTimeout(poll)}else if(activeJob)pollJob(activeJob)});init();
</script></body></html>
