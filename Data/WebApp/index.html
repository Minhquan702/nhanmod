function imgFallback(el,opacity=.15){
  if(!el.dataset.fb){
    el.dataset.fb='1';
    const explicit=el.dataset.fallback;
    const alt=explicit||el.src.replace(/head\.jpg(\?.*)?$/,'.jpg$1');

function initLazyImages(){
  lazyObserver?.disconnect();
  const root=document.getElementById('scrollArea');
  lazyObserver=new IntersectionObserver(entries=>{
    for(const e of entries){
      if(!e.isIntersecting)continue;
      const img=e.target; lazyObserver.unobserve(img);
      const src=img.dataset.src; if(!src)continue;

function lazyImg(url,extra=''){return `<img ${extra} data-src="${url}" loading="lazy" decoding="async" fetchpriority="low" onload="imgReady(this)" onerror="imgFallback(this,0)">`}

function letterOf(name){const c=(name||'').trim().charAt(0).toUpperCase();return c==='Đ'?'Đ':c}
const ALPHABET='ABCD'.split('').concat(['Đ']).concat('EFGHIJKLMNOPQRSTVWXYZ'.split(''));

function loadingHome(){return `<div class="summary">${[1,2,3].map(()=>`<div class="metric skeleton" style="height:78px"></div>`).join('')}</div><div class="progress-card skeleton" style="height:59px"></div><div class="skeleton" style="height:34px;width:48%;border-radius:10px;margin:20px 0 8px"></div><div class="skeleton" style="height:50px;border-radius:16px;margin-bottom:16px"></div><div class="az-grid">${Array(20).fill('<div class="az skeleton"></div>').join('')}</div>`}
function heroCount(h){return h.skinCount??h.skins?.length??0}
function summary(){const pct=Math.min(100,selections.length/MAX_SLOTS*100);return `<div class="summary">
<div class="metric"><div class="top"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 18c-2.2 0-4-1.8-4-4 0-1.7 1-3.1 2.5-3.7A6.5 6.5 0 0 1 18 8.5c1.7.5 3 2.1 3 4 0 2.2-1.8 4-4 4H7Z"/><circle cx="9" cy="11" r="1"/><circle cx="15" cy="11" r="1"/></svg><strong>${DATA.totalHeroes}</strong></div><span>TƯỚNG</span></div>
<div class="metric"><div class="top"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 7 4v5c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V7l7-4Z"/><path d="m9 12 2 2 4-4"/></svg><strong>${DATA.totalSkins}</strong></div><span>SKIN</span></div>
<div class="metric sel"><div class="top"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="5" width="14" height="14" rx="4"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg><strong>${selections.length}</strong></div><span>ĐÃ CHỌN</span></div></div>
<div class="progress-card"><div class="progress-row"><b>${selections.length} / ${MAX_SLOTS} SLOT</b><span>${selections.length>=MAX_SLOTS?'ĐÃ ĐẦY':'SẴN SÀNG'}</span></div><div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`}

async function loadData(){
  const cached=cacheGet('heroes');
  if(cached){DATA=cached;loaded=true;render()}
  try{
    const r=await fetch('api/heroes?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw Error(r.status);
    const fresh=await r.json();
    DATA=fresh;
    cacheSet('heroes',fresh);
    if(!loaded){loaded=true}
    render();
  }catch(e){
    if(!loaded)document.getElementById('app').innerHTML=`<div class="empty">Không tải được dữ liệu WebApp.<br>Hãy đóng và mở lại.</div>`;
  }

  // Reconcile counts in background from the full source.
  // Keeps first paint fast, then fixes totals/per-hero counts when full data arrives.
  try{
    const rf=await fetch('api/skins?ts='+Date.now(),{cache:'no-store'});
    if(rf.ok){
      const full=await rf.json();
      const heroes=Array.isArray(full.heroes)?full.heroes:[];
      const countMap=new Map();
      let total=0;
      for(const h of heroes){
        const c=Array.isArray(h.skins)?h.skins.length:0;
        countMap.set(h.name,c);
        total+=c;
      }
      if(DATA&&Array.isArray(DATA.heroes)){
        DATA.heroes=DATA.heroes.map(h=>({
          ...h,
          skinCount:countMap.has(h.name)?countMap.get(h.name):h.skinCount
        }));
        DATA.totalSkins=total||DATA.totalSkins;
        DATA.totalHeroes=heroes.length||DATA.totalHeroes;
        cacheSet('heroes',DATA);
        render();
      }
    }
  }catch(e){}
}
async function ensureSkins(h){
  if(h.skins||h._loading)return;
  const ck='skins_'+h.name;
  const cached=cacheGet(ck);
  if(Array.isArray(cached)&&cached.length){
    h.skins=cached;
    render();
    return;
  }

  h._loading=true;
  render();

  try{
    // Fast path: load only this hero.
    const r=await fetch('api/hero-skins?hero='+encodeURIComponent(h.name),{
      cache:'no-store'
    });
    if(!r.ok)throw new Error('lazy '+r.status);
    const d=await r.json();
    h.skins=Array.isArray(d.skins)?d.skins:[];
    if(!h.skins.length)throw new Error('lazy empty');
  }catch(e){
    // Safe fallback for older/current bot.py builds:
    // use the original full API and extract this hero locally.
    try{
      const r2=await fetch('api/skins?ts='+Date.now(),{cache:'no-store'});
      if(!r2.ok)throw new Error('full '+r2.status);
      const full=await r2.json();
      const hero=(full.heroes||[]).find(x=>x.name===h.name);
      h.skins=hero&&Array.isArray(hero.skins)?hero.skins:[];
    }catch(e2){
      h.skins=[];
    }
  }finally{
    h._loading=false;
    if(h.skins&&h.skins.length)cacheSet(ck,h.skins);
    render();
    if(!h.skins||!h.skins.length)toast('Chưa tải được skin • đóng/mở lại tướng');
  }
}

function push(x){stack.push(x);render();updateBack()}
function pop(){if(stack.length>1){stack.pop();render();updateBack()}}
function updateBack(){if(!tg)return;(tab==='heroes'&&stack.length>1)?tg.BackButton.show():tg.BackButton.hide()}
if(tg)tg.BackButton.onClick(pop);
function setTab(t){tab=t;['Heroes','Cart','Other'].forEach(x=>document.getElementById('nav'+x)?.classList.remove('on'));document.getElementById('nav'+(t==='heroes'?'Heroes':t==='cart'?'Cart':'Other'))?.classList.add('on');render();updateBack()}

function isSel(hero,skin){return selections.some(x=>x.tuong===hero&&x.skin===skin)}
function selectedHero(hero){return selections.find(x=>x.tuong===hero)}
function resolvedSelection(h){
  const sel=selectedHero(h.name); if(!sel)return null;
  const skin=h.skins?.find(s=>String(s.id)===String(sel.id)||s.name===sel.skin);
  if(skin&&!sel.icon){sel.icon=skin.icon;saveSelections()}
  return {...sel,icon:sel.icon||skin?.icon||h.icon};
}
function toggleSkin(hero,skin,id,icon=''){
  const old=selectedHero(hero);
  if(old?.skin===skin){
    selections=selections.filter(x=>x.tuong!==hero);
    saveSelections();
    haptic();toast('✓ Đã bỏ '+skin);render();return;
  }
  selections=selections.filter(x=>x.tuong!==hero);
  if(selections.length>=MAX_SLOTS){haptic();toast('Đã đủ 15 slot');return}
  selections.push({tuong:hero,skin,id,icon});
  saveSelections();
  haptic('success');
  toast('✓ Đã thêm '+skin);
  render();
}
function removeSelection(hero){selections=selections.filter(x=>x.tuong!==hero);saveSelections();haptic();render()}
function removeSelectionAt(i){selections.splice(i,1);saveSelections();haptic();render()}
function toggleSkinAt(heroIdx,skinIdx){const h=DATA.heroes[heroIdx],s=h?.skins?.[skinIdx];if(h&&s)toggleSkin(h.name,s.name,s.id,s.icon)}
function setPlatform(p){platformMode=p;haptic();render()}
function runMod(){
  if(!selections.length)return;
  const payload={action:'run',selections:[...selections],platform:platformMode};
  haptic('success');
  clearSavedSelections();
  selections=[];
  tg?.sendData(JSON.stringify(payload));
}

function heroInitial(name){const t=(name||'?').trim();return (t[0]||'?').toUpperCase()}
function heroRow(h){
  const idx=DATA.heroes.indexOf(h),sel=resolvedSelection(h);
  const icon=sel?.icon||h.icon;
  const sub=sel?`<small class="chosen-skin">▸ ${sel.skin}</small>`:`<small>${heroCount(h)} skin · chạm để xem</small>`;
  return `<button class="row ${sel?'chosen':''}" style="width:100%;text-align:left" onclick="push({screen:'detail',idx:${idx}})">${lazyImg(icon,'class="avatar"')}<div class="txt"><b>${h.name}</b>${sub}</div><svg class="chev" width="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></button>`
}
function azHTML(){const c={};DATA.heroes.forEach(h=>c[letterOf(h.name)]=(c[letterOf(h.name)]||0)+1);return `<div class="az-grid">${ALPHABET.map(l=>`<button class="az ${c[l]?'':'empty'}" ${c[l]?`onclick="push({screen:'list',letter:'${l}'})"`:''}>${c[l]?`<span class="cnt">${c[l]}</span>`:''}${l}</button>`).join('')}</div>`}
function screenAZ(){return `${summary()}<div class="section-kicker">Thư viện</div><h1>CHỌN <span class="hl">TƯỚNG</span></h1><p class="sub">Chạm chọn nhanh • tìm tướng hoặc skin tức thì</p><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input placeholder="Tìm tướng hoặc skin..." oninput="onSearch(this.value)"></div><div id="results">${azHTML()}</div>`}
function onSearch(v){clearTimeout(searchTimer);const q=v.trim();const box=document.getElementById('results');if(!q){box.innerHTML=azHTML();return}box.innerHTML='<div class="empty" style="padding:25px">Đang tìm...</div>';searchTimer=setTimeout(async()=>{try{const r=await fetch('api/search?q='+encodeURIComponent(q),{cache:'no-store'});const d=await r.json();box.innerHTML=d.heroes?.length?d.heroes.map(x=>{let h=DATA.heroes.find(k=>k.name===x.name);return h?heroRow(h):''}).join(''):'<div class="empty">Không tìm thấy kết quả.</div>'}catch(e){box.innerHTML='<div class="empty">Không thể tìm kiếm.</div>'}},130)}
function screenList(l){const hs=DATA.heroes.filter(h=>letterOf(h.name)===l);return `${summary()}<button class="back" onclick="stack=[{screen:'az'}];render();updateBack()"><svg width="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 6-6 6 6 6"/></svg> ĐỔI CHỮ CÁI</button><div class="section-kicker">Danh sách</div><h1>CHỮ <span class="hl">${l}</span></h1><p class="sub">${hs.length} tướng</p>${hs.map(heroRow).join('')}`}
function skinSkeleton(){return `<div class="skin-grid">${Array(9).fill('<div class="skin"><span class="skin-pic skeleton"></span><span class="shade">&nbsp;</span></div>').join('')}</div>`}
function screenDetail(idx){
  const h=DATA.heroes[idx];
  if(!h.skins&&!h._loading)setTimeout(()=>ensureSkins(h),0);
  const sel=resolvedSelection(h);
  const heroImg=sel?.icon||h.icon;
  const status=sel?`<span class="chosen-skin">▸ ĐANG CHỌN: ${sel.skin}</span>`:`<span>${heroCount(h)} skin • mỗi tướng chọn 1 skin</span>`;
  return `${summary()}<button class="back" onclick="stack=[{screen:'az'}];render();updateBack()"><svg width="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 6-6 6 6 6"/></svg> ĐỔI TƯỚNG</button><div class="hero-card ${sel?'chosen':''}"><img class="avatar" src="${heroImg}" decoding="async" fetchpriority="high" onload="imgReady(this)" onerror="imgFallback(this,0)"><div><b>${h.name}</b>${status}</div></div>${h._loading||!h.skins?skinSkeleton():`<div class="skin-grid">${h.skins.map((s,si)=>`<button class="skin ${sel?.skin===s.name?'sel':''}" onclick="toggleSkinAt(${idx},${si})"><span class="skin-pic">${lazyImg(s.icon,`data-fallback="${s.icon_fallback||''}" onerror="imgFallback(this,.15)"`)}<span class="check">✓</span></span><span class="shade">${s.name}</span></button>`).join('')}</div>`}`}

function platformCard(){return `<div class="platform"><div class="platform-head"><svg width="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M7 3h10a2 2 0 0 1 2 2v14H5V5a2 2 0 0 1 2-2Z"/><path d="M9 18h6"/></svg><div><b>Gói thiết bị</b><small>Chọn đúng máy để file nhẹ hơn</small></div></div><div class="segment"><button class="seg ${platformMode==='android'?'on':''}" onclick="setPlatform('android')">${ICON.android} Android</button><button class="seg ${platformMode==='ios'?'on':''}" onclick="setPlatform('ios')">${ICON.ios} iOS</button><button class="seg ${platformMode==='both'?'on':''}" onclick="setPlatform('both')">${ICON.both} Cả 2</button></div><div class="tip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"/></svg><span>Android hoặc iOS riêng sẽ bỏ bản còn lại khỏi file ZIP — giảm dung lượng mạnh mà vẫn giữ nguyên resource/hiệu ứng của nền tảng đã chọn.</span></div></div>`}
function cart(){if(!selections.length)return `${summary()}<div class="empty"><b style="color:var(--text)">Chưa chọn skin</b><br><br>Vào tab TƯỚNG để bắt đầu.</div>`;return `${summary()}<div class="section-kicker">Xác nhận</div><h1>ĐÃ <span class="hl">CHỌN</span></h1><p class="sub">Kiểm tra skin và chọn đúng nền tảng trước khi tạo file</p>${selections.map((x,i)=>{const h=DATA.heroes.find(k=>k.name===x.tuong);const sk=h?.skins?.find(k=>k.name===x.skin);return `<div class="cart-row">${lazyImg(sk?.icon||h?.icon||'')}<div class="txt"><b>${x.tuong}</b><small>${x.skin}</small></div><button class="remove" onclick="removeSelectionAt(${i})">✕</button></div>`}).join('')}${platformCard()}<button class="run" onclick="runMod()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 5 11 7-11 7V5Z"/></svg>TẠO MOD • ${selections.length} SKIN</button>`}
function other(){return `${summary()}<div class="section-kicker">Thiết lập</div><h1>TÙY <span class="hl">CHỌN</span></h1><p class="sub">Thiết bị mặc định được nhận diện từ Telegram</p>${platformCard()}<div class="row" style="align-items:flex-start"><svg width="24" style="color:var(--cyan);flex:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg><div class="txt"><b>Cách sử dụng</b><small style="line-height:1.6">Chọn tướng → chọn skin → tab ĐÃ CHỌN → chọn Android/iOS → TẠO MOD. Bot sẽ trả tiến độ tạo file và tiến độ upload ngay trong chat.</small></div></div>`}
function render(){const a=document.getElementById('app');const b=document.getElementById('cartBadge');if(b){b.textContent=selections.length;b.classList.toggle('hidden',!selections.length)}let html;if(!loaded)html=loadingHome();else if(tab==='cart')html=cart();else if(tab==='other')html=other();else{const top=stack.at(-1);html=top.screen==='az'?screenAZ():top.screen==='list'?screenList(top.letter):screenDetail(top.idx)}a.innerHTML=html;requestAnimationFrame(postRender)}
loadSavedSelections();setTab('heroes');loadData();
</script>
